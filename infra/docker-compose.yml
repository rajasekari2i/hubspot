services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pipeline_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pipeline_intelligence
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker-pubsub:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.pubsub_consumer"]
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pipeline_intelligence
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-c", "
import asyncio, schedule, time;
from app.workers.watch_renewer import renew_all_watches, check_inactivity;
from app.workers.expiration_worker import expire_stale_recommendations;
from app.workers.token_refresher import refresh_expiring_tokens;
from app.workers.dlq_processor import process_dlq;
from app.workers.pipeline_sync import sync_pipelines;
loop = asyncio.new_event_loop();
schedule.every(1).day.do(lambda: loop.run_until_complete(renew_all_watches()));
schedule.every(1).hour.do(lambda: loop.run_until_complete(check_inactivity()));
schedule.every(5).minutes.do(lambda: loop.run_until_complete(expire_stale_recommendations()));
schedule.every(10).minutes.do(lambda: loop.run_until_complete(refresh_expiring_tokens()));
schedule.every(2).minutes.do(lambda: loop.run_until_complete(process_dlq()));
schedule.every(6).hours.do(lambda: loop.run_until_complete(sync_pipelines()));
while True: schedule.run_pending(); time.sleep(30)
      "]
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pipeline_intelligence
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
